<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 510" width="100%" height="510">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0D18"/>
      <stop offset="60%" stop-color="#0C0A14"/>
      <stop offset="100%" stop-color="#09090D"/>
    </linearGradient>

    <linearGradient id="dropCapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="purpleGlowCard" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="amberGlowCard" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes netPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes ringSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ringSpinRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .node-hub { transform-origin: 730px 170px; animation: ringSpin 24s linear infinite; }
    .node-hub-rev { transform-origin: 730px 170px; animation: ringSpinRev 16s linear infinite; }
    .center-core { transform-origin: 730px 170px; animation: netPulse 3s ease-in-out infinite; }
  </style>

  <!-- Card Background Surface -->
  <rect x="0" y="0" width="850" height="510" rx="8" fill="url(#cardBg)" stroke="#251E3B" stroke-width="1.2"/>

  <!-- Tactical Corner Crossbars -->
  <path d="M 12 32 L 12 12 L 32 12" fill="none" stroke="#A855F7" stroke-width="2" filter="url(#purpleGlowCard)"/>
  <path d="M 838 32 L 838 12 L 818 12" fill="none" stroke="#A855F7" stroke-width="2" filter="url(#purpleGlowCard)"/>
  <path d="M 12 478 L 12 498 L 32 498" fill="none" stroke="#A855F7" stroke-width="2" filter="url(#purpleGlowCard)"/>
  <path d="M 838 478 L 838 498 L 818 498" fill="none" stroke="#A855F7" stroke-width="2" filter="url(#purpleGlowCard)"/>

  <!-- Card Header Indicator -->
  <text x="35" y="38" fill="#94A3B8" font-size="9" letter-spacing="1.8" class="mono">DOSSIER // AGENT_FILE: MARCOS_AOSF</text>
  <text x="740" y="38" fill="#F59E0B" font-size="9" font-weight="700" letter-spacing="1" class="mono">CONFIDENTIAL</text>
  <line x1="35" y1="48" x2="815" y2="48" stroke="#251E3B" stroke-width="0.8"/>

  <!-- Large Stylized Drop Cap Letter "P" (Profissional) -->
  <g>
    <rect x="35" y="65" width="46" height="58" rx="4" fill="#171326" stroke="#7C3AED" stroke-width="1"/>
    <text x="45" y="112" fill="url(#dropCapGrad)" font-size="48" font-weight="900" class="mono" filter="url(#purpleGlowCard)">P</text>
  </g>

  <!-- Narrative Summary (Real from CV) -->
  <g class="sans" fill="#E2E8F0" font-size="13" letter-spacing="0.2">
    <text x="94" y="84">
      <tspan font-weight="600" fill="#FBBF24">rofissional de TI com atuação em suporte avançado (N2), administração de sistemas</tspan>
    </text>
    <text x="94" y="103">
      e infraestrutura de redes em ambientes de missão crítica e supercomputação no INPE.
    </text>
    <text x="35" y="130">
      Experiência sólida com Windows Server, Linux, redes Cisco, Data Center, fibra óptica, Zabbix,
    </text>
    <text x="35" y="151">
      Grafana e automação de processos com Python, Bash e PowerShell para ganho de escala.
    </text>
    <text x="35" y="172">
      Foco em alta disponibilidade, segurança perimétrica, governança de TI e orquestração ágil.
    </text>
  </g>

  <!-- Animated Interactive Network / Telemetry Mandala (Right Side) -->
  <g>
    <!-- Outer Orbit Ring -->
    <circle cx="730" cy="170" r="70" fill="none" stroke="#251E3B" stroke-width="1.2" stroke-dasharray="4 6"/>
    
    <!-- Rotating Node Ring 1 -->
    <g class="node-hub">
      <circle cx="730" cy="170" r="50" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="12 18"/>
      <circle cx="780" cy="170" r="3.5" fill="#A855F7" filter="url(#purpleGlowCard)"/>
      <circle cx="680" cy="170" r="3.5" fill="#A855F7"/>
      <circle cx="730" cy="120" r="3.5" fill="#F59E0B" filter="url(#amberGlowCard)"/>
      <circle cx="730" cy="220" r="3.5" fill="#C084FC"/>
    </g>

    <!-- Rotating Inner Ring 2 -->
    <g class="node-hub-rev">
      <polygon points="730,135 760,185 700,185" fill="none" stroke="#A855F7" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="760" cy="185" r="2.5" fill="#FBBF24"/>
      <circle cx="700" cy="185" r="2.5" fill="#FBBF24"/>
    </g>

    <!-- Center Pulse Core -->
    <circle cx="730" cy="170" r="14" fill="#171326" stroke="#F59E0B" stroke-width="1.5" class="center-core" filter="url(#amberGlowCard)"/>
    <circle cx="730" cy="170" r="5" fill="#F59E0B"/>
    
    <text x="693" y="256" fill="#94A3B8" font-size="8.5" letter-spacing="1" class="mono">SOC_ORCHESTRATOR</text>
  </g>

  <!-- Divider Line -->
  <line x1="35" y1="198" x2="620" y2="198" stroke="#251E3B" stroke-width="1"/>

  <!-- Technical Specification Matrix (HUD Key-Value Grid) -->
  <g class="mono" font-size="11">
    <!-- Item 1: CLASSE -->
    <text x="35" y="230" fill="#F59E0B" font-weight="700">◇ CLASSE</text>
    <text x="185" y="230" fill="#E2E8F0">Técnico de Suporte N2 • Infraestrutura, Redes &amp; SysAdmin</text>

    <!-- Item 2: BASE OPERACIONAL -->
    <text x="35" y="268" fill="#F59E0B" font-weight="700">◇ BASE OPERACIONAL</text>
    <text x="185" y="268" fill="#E2E8F0">INPE — Ambientes de Missão Crítica &amp; Supercomputação</text>

    <!-- Item 3: OPERAÇÃO -->
    <text x="35" y="306" fill="#F59E0B" font-weight="700">◇ OPERAÇÃO</text>
    <text x="185" y="306" fill="#E2E8F0">Redes Cisco, Data Center, Fibra Óptica (OTDR), Zabbix/Grafana e CFTV IP</text>

    <!-- Item 4: AUTOMAÇÃO -->
    <text x="35" y="344" fill="#F59E0B" font-weight="700">◇ AUTOMAÇÃO</text>
    <text x="185" y="344" fill="#E2E8F0">Scripts em Python, Bash e PowerShell + Orquestração com IA</text>

    <!-- Item 5: FORMAÇÃO -->
    <text x="35" y="382" fill="#F59E0B" font-weight="700">◇ FORMAÇÃO</text>
    <text x="185" y="382" fill="#E2E8F0">Pós em Eng. de Redes &amp; Seg. de Dados • Pós em Cibersegurança • ADS</text>

    <!-- Item 6: PERFIL -->
    <text x="35" y="420" fill="#F59E0B" font-weight="700">◇ PERFIL</text>
    <text x="185" y="420" fill="#E2E8F0">Disciplina operacional (ex-Militar 5º BIL Aeromóvel), foco em alta disponibilidade</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <rect x="35" y="460" width="780" height="22" rx="3" fill="#131020" stroke="#251E3B" stroke-width="0.8"/>
  <circle cx="50" cy="471" r="3" fill="#A855F7"/>
  <text x="62" y="475" fill="#94A3B8" font-size="9" letter-spacing="1" class="mono">MISSION: CRITICAL_DEFENSE • DISCIPLINE: 5_BIL_AIRMOBILE • STATUS: ENGAGED</text>
</svg>
