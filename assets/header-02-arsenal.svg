<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 56" width="100%" height="56">
  <defs>
    <linearGradient id="gradLine_02" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="35%" stop-color="#7C3AED"/>
      <stop offset="75%" stop-color="#251E3B"/>
      <stop offset="100%" stop-color="#09090D" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowHead_02" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
  </style>

  <!-- Left Accent Marker -->
  <rect x="0" y="12" width="5" height="32" rx="2" fill="#F59E0B"/>
  
  <!-- Number & Title -->
  <text x="20" y="34" fill="#A855F7" font-size="16" font-weight="900" class="mono" filter="url(#glowHead_02)">02</text>
  <text x="52" y="34" fill="#F59E0B" font-size="15" font-weight="700" class="mono">//</text>
  <text x="75" y="34" fill="#E2E8F0" font-size="16" font-weight="800" letter-spacing="2" class="mono">ARSENAL</text>

  <!-- Dynamic Guideline Line -->
  <line x1="162" y1="30" x2="720" y2="30" stroke="url(#gradLine_02)" stroke-width="1.2"/>
  <circle cx="162" cy="30" r="2.5" fill="#A855F7"/>

  <!-- Right Technical Badge Tag -->
  <rect x="725" y="16" width="120" height="24" rx="3" fill="#0F0D18" stroke="#251E3B" stroke-width="1"/>
  <circle cx="738" cy="28" r="3" fill="#A855F7"/>
  <text x="748" y="32" fill="#94A3B8" font-size="9" font-weight="700" letter-spacing="1" class="mono">SKILL.TREE</text>
</svg>
