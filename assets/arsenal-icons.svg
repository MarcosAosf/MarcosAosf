<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 68" width="100%" height="68">
  <defs>
    <!-- Background Card Linear Gradient -->
    <linearGradient id="iconCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181528"/>
      <stop offset="100%" stop-color="#0E0C18"/>
    </linearGradient>

    <!-- Python Gradient -->
    <linearGradient id="pyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387EB8"/>
      <stop offset="100%" stop-color="#366994"/>
    </linearGradient>
    <linearGradient id="pyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE873"/>
      <stop offset="100%" stop-color="#FFD43B"/>
    </linearGradient>

    <!-- Subtle Glow for Hover/Active feel -->
    <filter id="iconSubtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .icon-card {
      fill: url(#iconCardGrad);
      stroke: #251E3B;
      stroke-width: 1.2;
      transition: stroke 0.3s ease;
    }
    .icon-card:hover {
      stroke: #A855F7;
    }
  </style>

  <!-- ========================================== -->
  <!-- 1. WINDOWS (x = 35) -->
  <!-- ========================================== -->
  <g transform="translate(35, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(11, 11)">
      <!-- Windows 4 colored tiles or modern blue -->
      <path d="M 0 3.8 L 10.6 2.3 L 10.6 12 L 0 12 Z" fill="#00ADEF"/>
      <path d="M 12.2 2.1 L 26 0 L 26 12 L 12.2 12 Z" fill="#00ADEF"/>
      <path d="M 0 13.5 L 10.6 13.5 L 10.6 23.2 L 0 21.7 Z" fill="#00ADEF"/>
      <path d="M 12.2 13.5 L 26 13.5 L 26 25.5 L 12.2 23.4 Z" fill="#00ADEF"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 2. LINUX (x = 90) -->
  <!-- ========================================== -->
  <g transform="translate(90, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(12, 10)">
      <!-- Tux Penguin Head & Body -->
      <ellipse cx="12" cy="17" rx="9" ry="11" fill="#E2E8F0"/>
      <!-- Black Coat -->
      <path d="M 4 22 C 3 13 6 5 12 5 C 18 5 21 13 20 22 C 21 24 23 27 21 27 C 19 27 18 25 17 25 C 15 27 9 27 7 25 C 6 25 5 27 3 27 C 1 27 3 24 4 22 Z" fill="#1E293B"/>
      <!-- White Belly -->
      <ellipse cx="12" cy="18" rx="5.5" ry="7" fill="#F8FAFC"/>
      <!-- Eyes -->
      <circle cx="10" cy="9.5" r="1.3" fill="#09090D"/>
      <circle cx="14" cy="9.5" r="1.3" fill="#09090D"/>
      <!-- Beak -->
      <polygon points="10.5,12 13.5,12 12,14.5" fill="#F59E0B"/>
      <!-- Feet -->
      <ellipse cx="8.5" cy="26" rx="3.5" ry="1.5" fill="#F59E0B"/>
      <ellipse cx="15.5" cy="26" rx="3.5" ry="1.5" fill="#F59E0B"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 3. MACOS (x = 145) -->
  <!-- ========================================== -->
  <g transform="translate(145, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(13, 11)">
      <!-- Apple Silhouette in Crisp Platinum/White -->
      <path d="M 15.5 0 C 16.5 1.5 16 3 15 4 C 14 5 12.5 5.5 12 4 C 12 2.5 13.5 1 15.5 0 Z" fill="#E2E8F0"/>
      <path d="M 18.5 7.5 C 17.5 8 16 7.5 14.5 7.5 C 12.5 7.5 11 8.5 10 8.5 C 8.5 8.5 7 7.5 5.5 7.5 C 2.5 7.5 0 10.5 0 15 C 0 19.5 2 24.5 4.5 24.5 C 5.5 24.5 6.5 23.5 8 23.5 C 9.5 23.5 10.5 24.5 12 24.5 C 14.5 24.5 16.5 19.5 16.5 19 C 16.5 19 13.5 17.5 13.5 14 C 13.5 11 16 9.5 16.5 9 C 15 7.5 13 7.5 12.5 7.5 C 14 6.5 17 6.5 18.5 7.5 Z" fill="#E2E8F0"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 4. CISCO (x = 200) -->
  <!-- ========================================== -->
  <g transform="translate(200, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(11, 14)">
      <!-- Cisco Official Bridge Soundwave Bars (Cyan/Blue Theme) -->
      <!-- Bar 1 -->
      <rect x="0" y="9" width="2.4" height="6" rx="1.2" fill="#049FD9"/>
      <!-- Bar 2 -->
      <rect x="4.8" y="4" width="2.4" height="11" rx="1.2" fill="#049FD9"/>
      <!-- Bar 3 -->
      <rect x="9.6" y="9" width="2.4" height="6" rx="1.2" fill="#049FD9"/>
      <!-- Bar 4 (Center Tall) -->
      <rect x="14.4" y="0" width="2.4" height="15" rx="1.2" fill="#00BCEB"/>
      <!-- Bar 5 -->
      <rect x="19.2" y="9" width="2.4" height="6" rx="1.2" fill="#049FD9"/>
      <!-- Bar 6 -->
      <rect x="24" y="4" width="2.4" height="11" rx="1.2" fill="#049FD9"/>
      <!-- Bar 7 -->
      <rect x="28.8" y="9" width="2.4" height="6" rx="1.2" fill="#049FD9"/>
      <!-- Wordmark CISCO -->
      <text x="15.6" y="24" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="900" text-anchor="middle" letter-spacing="1">CISCO</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 5. ZABBIX (x = 255) -->
  <!-- ========================================== -->
  <g transform="translate(255, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(11, 11)">
      <!-- Official Zabbix Red Badge with Sharp White Z -->
      <rect x="1" y="1" width="24" height="24" rx="4" fill="#D40000"/>
      <path d="M 6 6 L 20 6 L 20 8.5 L 10.5 17.5 L 20 17.5 L 20 20 L 6 20 L 6 17.5 L 15.5 8.5 L 6 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 6. GRAFANA (x = 310) -->
  <!-- ========================================== -->
  <g transform="translate(310, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(11, 11)">
      <!-- Official Grafana Spiral Portal (Orange/Amber & Dark) -->
      <circle cx="13" cy="13" r="12" fill="#1F1D2B"/>
      <!-- Outer Flame Arc -->
      <path d="M 13 2 A 11 11 0 0 1 24 13 A 11 11 0 0 1 18 22.5 L 15.5 19.5 A 7 7 0 0 0 20 13 A 7 7 0 0 0 13 6 Z" fill="#F46800"/>
      <!-- Mid Glow Arc -->
      <path d="M 13 6 A 7 7 0 0 1 20 13 A 7 7 0 0 1 15.5 19.5 L 13.5 17 A 4.5 4.5 0 0 0 17.5 13 A 4.5 4.5 0 0 0 13 8.5 Z" fill="#FF9900"/>
      <!-- Center Eye -->
      <circle cx="13" cy="13" r="2.8" fill="#F59E0B"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 7. PYTHON (x = 365) -->
  <!-- ========================================== -->
  <g transform="translate(365, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(12, 12)">
      <!-- Blue Upper Python Snake -->
      <path d="M 11.5 0 C 5.5 0 6 2.5 6 2.5 L 6 5 L 12 5 L 12 6 L 3.5 6 C 1 6 0 7.5 0 11.5 C 0 15.5 2 16 3.5 16 L 5.5 16 L 5.5 13.5 C 5.5 11 7.5 9 10 9 L 16 9 C 18 9 19 8 19 6 L 19 3 C 19 1 17.5 0 11.5 0 Z M 8.5 1.5 C 9.2 1.5 9.8 2 9.8 2.8 C 9.8 3.5 9.2 4 8.5 4 C 7.8 4 7.2 3.5 7.2 2.8 C 7.2 2 7.8 1.5 8.5 1.5 Z" fill="url(#pyBlue)"/>
      <!-- Yellow Lower Python Snake -->
      <path d="M 12.5 24 C 18.5 24 18 21.5 18 21.5 L 18 19 L 12 19 L 12 18 L 20.5 18 C 23 18 24 16.5 24 12.5 C 24 8.5 22 8 20.5 8 L 18.5 8 L 18.5 10.5 C 18.5 13 16.5 15 14 15 L 8 15 C 6 15 5 16 5 18 L 5 21 C 5 23 6.5 24 12.5 24 Z M 15.5 22.5 C 14.8 22.5 14.2 22 14.2 21.2 C 14.2 20.5 14.8 20 15.5 20 C 16.2 20 16.8 20.5 16.8 21.2 C 16.8 22 16.2 22.5 15.5 22.5 Z" fill="url(#pyYellow)"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 8. BASH (x = 420) -->
  <!-- ========================================== -->
  <g transform="translate(420, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(12, 12)">
      <!-- Dark Terminal Slate with >_ prompt -->
      <rect width="24" height="24" rx="4" fill="#283540"/>
      <path d="M 4 7 L 10 12 L 4 17" fill="none" stroke="#4EAA25" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="12" y1="17" x2="20" y2="17" stroke="#4EAA25" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 9. POWERSHELL (x = 475) -->
  <!-- ========================================== -->
  <g transform="translate(475, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(12, 12)">
      <!-- PowerShell Blue Screen with >_ Icon -->
      <rect width="24" height="24" rx="4" fill="#012456"/>
      <path d="M 4 7 L 11 12 L 4 17" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="13" y1="17" x2="20" y2="17" stroke="#25C1F0" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 10. JAVASCRIPT (x = 530) -->
  <!-- ========================================== -->
  <g transform="translate(530, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(12, 12)">
      <!-- JS Yellow Box with JS letters -->
      <rect width="24" height="24" rx="4" fill="#F7DF1E"/>
      <text x="14" y="20.5" fill="#000000" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11.5" letter-spacing="-0.5">JS</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 11. NODE.JS (x = 585) -->
  <!-- ========================================== -->
  <g transform="translate(585, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(11, 11)">
      <!-- Node Hexagon & Emerald Swatch -->
      <polygon points="13,1 24,7 24,19 13,25 2,19 2,7" fill="#333333"/>
      <polygon points="13,3 22,8 22,18 13,23 4,18 4,8" fill="#5FA04E"/>
      <!-- Inner 'N' -->
      <path d="M 8 18 L 8 9 L 10.5 9 L 15.5 15 L 15.5 9 L 18 9 L 18 18 L 15.5 18 L 10.5 12 L 10.5 18 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 12. THREE.JS (x = 640) -->
  <!-- ========================================== -->
  <g transform="translate(640, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(12, 11)">
      <!-- Three.js Triangular Geometry in Clean White -->
      <polygon points="1,24 12,1 23,24" fill="none" stroke="#E2E8F0" stroke-width="1.8"/>
      <line x1="12" y1="1" x2="12" y2="24" stroke="#E2E8F0" stroke-width="1.5"/>
      <polygon points="6.5,12.5 17.5,12.5 12,24" fill="#A855F7" fill-opacity="0.3" stroke="#A855F7" stroke-width="1"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 13. GIT (x = 695) -->
  <!-- ========================================== -->
  <g transform="translate(695, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(11, 11)">
      <!-- Git Orange Diamond with Branch Nodes -->
      <rect x="3" y="3" width="18" height="18" rx="3.5" transform="rotate(45 12 12)" fill="#F05032"/>
      <!-- Inner branch graph -->
      <circle cx="9" cy="15" r="2" fill="#FFFFFF"/>
      <circle cx="15" cy="9" r="2" fill="#FFFFFF"/>
      <circle cx="9" cy="9" r="2" fill="#FFFFFF"/>
      <line x1="9" y1="15" x2="9" y2="9" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M 9 12 Q 12 12 15 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 14. GITHUB ACTIONS (x = 750) -->
  <!-- ========================================== -->
  <g transform="translate(750, 10)">
    <rect width="48" height="48" rx="10" class="icon-card"/>
    <g transform="translate(11, 11)">
      <!-- GitHub Actions Blue Tech Circle with Gear & Arrow -->
      <circle cx="13" cy="13" r="11" fill="#2088FF"/>
      <!-- Action curved pipeline arrows -->
      <path d="M 7 13 A 6 6 0 0 1 17 8 L 19 6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
      <polygon points="19,10 19,5 14,5" fill="#FFFFFF"/>
      <path d="M 19 13 A 6 6 0 0 1 9 18 L 7 20" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
      <polygon points="7,16 7,21 12,21" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
